spring:
  application:
    name: parcel-machine-service

server:
  port: 8400

overpass:
  base-url: https://overpass-api.de/api

jpa:
  hibernate:
    ddl-auto: none
  properties:
    hibernate:
      format_sql: true
  datasource:
    url: jdbc:mysql://${config.database.mysql.host}:${config.database.mysql.port}/${config.database.mysql.name}?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
    username: ${config.database.mysql.username}
    password: ${config.database.mysql.password}

config:
  database:
    mysql:
      host: localhost
      port: 3310
      name: db_1
      username: user
      password: user1234